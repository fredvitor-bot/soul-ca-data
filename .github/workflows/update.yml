name: Atualizar disponibilidade Cruise America
on:
  schedule:
    - cron: "0 13 * * 1"   # toda segunda, 10h no horario de Brasilia
  workflow_dispatch: {}     # botao "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pdfplumber
      - name: Baixar e extrair
        run: python parse_ca.py --download --pdf CruiseAmerica-Flexrates.pdf --out public/cruise-america-availability.json
      - name: Publicar se mudou
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add public/cruise-america-availability.json
          git diff --cached --quiet || (git commit -m "Atualiza disponibilidade $(date +%F)" && git push)
